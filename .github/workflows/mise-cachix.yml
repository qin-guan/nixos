name: mise-cachix

on:
  schedule:
    # 04:00 UTC daily. GITHUB_TOKEN pushes do not retrigger workflows, so
    # lockfile updates must live in the same job as the Cachix build.
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - flake.lock
      - flake.nix
      - modules/home/mise.nix
      - .github/workflows/mise-cachix.yml

concurrency:
  group: mise-cachix

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Require Cachix configuration
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_CACHE" ]; then
            echo "::error::Set repository variable CACHIX_CACHE to your Cachix cache name"
            exit 1
          fi
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::Set repository secret CACHIX_AUTH_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        if: github.event_name != 'push'
        run: nix flake update

      - name: Build mise
        run: |
          nix build --print-build-logs \
            .#nixosConfigurations.qins-nixos.config.home-manager.users.qinguan.programs.mise.package

      - name: Commit flake.lock
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "flake.lock is already up to date"
            exit 0
          fi
          git commit -m "chore: update flake.lock"
          git push
