name: mise-cachix

on:
  schedule:
    # 04:00 and 16:00 UTC. Compare the latest stable jdx/mise release with the
    # ref in flake.nix. Update and build only when they differ.
    # GITHUB_TOKEN pushes do not retrigger workflows, so the flake update and
    # Cachix build stay in this workflow.
    - cron: "0 4,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - flake.lock
      - flake.nix
      - modules/home/mise.nix
      - .mise/tasks/bump-mise/**
      - .github/workflows/mise-cachix.yml

concurrency:
  group: mise-cachix

# The steps below run the mise file tasks in .mise/tasks/bump-mise directly,
# so CI does not need mise installed. Locally: mise run bump-mise:<task>.
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.version.outputs.latest }}
      update: ${{ steps.version.outputs.update }}
      # Pushes rebuild the current ref; scheduled runs build only on a new release.
      build: ${{ github.event_name == 'push' || steps.version.outputs.update == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare mise with the latest stable release
        id: version
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .mise/tasks/bump-mise/check

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Require Cachix configuration
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          : "${CACHIX_CACHE:?Set repository variable CACHIX_CACHE to your Cachix cache name}"
          : "${CACHIX_AUTH_TOKEN:?Set repository secret CACHIX_AUTH_TOKEN}"

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update mise ref
        if: needs.check.outputs.update == 'true'
        env:
          LATEST: ${{ needs.check.outputs.latest }}
        run: .mise/tasks/bump-mise/update "$LATEST"

      - name: Build mise
        run: .mise/tasks/bump-mise/build

      - name: Commit mise update
        if: needs.check.outputs.update == 'true'
        env:
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          if git diff --cached --quiet; then
            echo "mise ref is already up to date"
            exit 0
          fi
          git commit -m "chore: update mise to ${LATEST}"
          git push
